name: Backup

# Nightly database backup (PLAN.md S11), which also keeps the free Supabase project from pausing.
# The dump is encrypted with BACKUP_PASSPHRASE before it is stored: artifacts of a public
# repository can be downloaded by anyone. Nothing here prints a host, a key or the data.
#
# Restore (on a machine with .env.local):
#   gh run download <run-id> -n <artifact>   then
#   BACKUP_PASSPHRASE=… openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -in backup.tgz.enc -pass env:BACKUP_PASSPHRASE | tar xz
on:
  schedule:
    - cron: '0 18 * * *' # 03:00 in Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: nightly-backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check required secrets
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit "$missing"
      - name: Install dependencies (the pinned Supabase CLI)
        run: npm ci --no-audit --no-fund
      - name: Dump the database
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::add-mask::$SUPABASE_PROJECT_REF"
          mkdir -p "$RUNNER_TEMP/backup"
          # The CLI's own output can name the project, so it goes to a file that is never shown.
          log="$RUNNER_TEMP/supabase.log"
          if ! npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" >"$log" 2>&1; then
            echo "::error::supabase link failed"; exit 1
          fi
          for part in schema data; do
            flag=""; [ "$part" = data ] && flag="--data-only"
            if ! npx supabase db dump --linked $flag -f "$RUNNER_TEMP/backup/$part.sql" >>"$log" 2>&1; then
              echo "::error::supabase db dump ($part) failed"; exit 1
            fi
          done
          wc -c "$RUNNER_TEMP"/backup/*.sql | awk '{print "dump:", $2 ~ /total/ ? "total" : $2, $1, "bytes"}' | sed "s|$RUNNER_TEMP/backup/||"
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf "$RUNNER_TEMP/backup.tgz" -C "$RUNNER_TEMP/backup" .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/backup.tgz" -out backup.tgz.enc -pass env:BACKUP_PASSPHRASE
          rm -rf "$RUNNER_TEMP/backup" "$RUNNER_TEMP/backup.tgz" "$RUNNER_TEMP/supabase.log"
          echo "encrypted: $(wc -c < backup.tgz.enc) bytes"
      - uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.run_id }}
          path: backup.tgz.enc
          retention-days: 14
          if-no-files-found: error
